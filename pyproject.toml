[project]
name = "skillguard"
version = "0.1.0"
description = "Static security scanner for AI agent skills, MCP servers, and agent extensions."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nilay Mallik" }]
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = [
  "langchain-openai>=0.2",
  "langsmith>=0.1",
  "langgraph-checkpoint-sqlite>=2.0",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-httpx",
  "syrupy",
  "ruff",
  "mypy",
  "types-PyYAML",
  "pre-commit",
  "langgraph-cli[inmem]",
]

[project.scripts]
skillguard = "skillguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"